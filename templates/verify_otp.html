{% extends 'base.html' %}

{% block title %} Verify OTP - SNM {% endblock %}


{% block content %}

        <div class="container">
            <div class="card">
                <h2>✉️ Verify Your Email</h2>
                <p class="text-center">We've sent a 6-digit OTP to your email address.</p>
                <form method="POST">
                    <div class="form-group">
                        <label for="otp">Enter OTP</label>
                        <input type="text" id="otp" name="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Verify OTP</button>
                </form>
                <p class="text-center">
                    Didn't receive OTP? <a href="{{url_for('resend_otp')}}">Resend OTP</a>
                </p>
            </div>
        </div>
{% endblock %}
