{% extends 'base.html' %}

{% block title %} Add Note - SNM {% endblock %}

{% block content %}
        <div class="container">
            <div class="card" style="max-width: 600px;">
                <h2>📝 Add New Note</h2>
                <form method="POST">
                    <div class="form-group">
                        <label for="title">Note Title</label>
                        <input type="text" id="title" name="title" placeholder="Enter note title" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" placeholder="Write your note content here..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Note</button>
                </form>
                <p class="text-center">
                    <a href="{{url_for('notes')}}">← Back to Notes</a>
                </p>
            </div>
        </div>
 
{% endblock %}
